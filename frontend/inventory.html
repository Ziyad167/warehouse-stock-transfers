<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Warehouse Stock Transfers</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <h1>Inventory Management</h1>
    <p>View, check and update the stock of each warehouse.</p>
    <p id="api-status" class="api-status">Checking API...</p>
    <div id="user-bar" class="user-bar" hidden>
        <span id="user-info"></span>
        <button id="logout-button" type="button">Log Out</button>
    </div>
</header>

<section id="login-panel" class="panel login-panel" hidden>
    <h2>Log In</h2>
    <form id="login-form">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" required>
        <label for="login-password">Password</label>
        <input id="login-password" type="password" required>
        <button type="submit">Log In</button>
    </form>
</section>

<main id="app" class="container" hidden>
    <section class="panel">
        <h2>Warehouse Stock</h2>
        <label for="warehouse-select">Warehouse</label>
        <select id="warehouse-select"></select>
        <div id="stock-list"></div>
    </section>

    <section class="panel">
        <div id="add-section">
            <h2>Add Item to This Warehouse</h2>
            <form id="add-form">
                <label for="add-item">Item</label>
                <select id="add-item" required></select>
                <label for="add-quantity">Starting quantity</label>
                <input id="add-quantity" type="number" min="0" required>
                <button type="submit">Add to Warehouse</button>
            </form>
        </div>

        <h2>Check Availability</h2>
        <form id="check-form">
            <label for="check-item">Item</label>
            <select id="check-item" required></select>
            <label for="check-quantity">Quantity needed</label>
            <input id="check-quantity" type="number" min="1" required>
            <button type="submit">Check</button>
        </form>
        <p id="check-result"></p>
    </section>

    <section class="panel">
        <h2>Search Items</h2>
        <form id="search-form">
            <label for="search-text">Name, SKU or category</label>
            <input id="search-text" type="text">
            <button type="submit">Search</button>
        </form>
        <ul id="items-list"></ul>
    </section>
</main>

<p id="message" aria-live="polite"></p>

<!-- config.js (API URL) must load before app.js. defer keeps this order. -->
<script src="js/config.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
